name: Anan Stack-chan

on:
  push:
    branches:
      - anan/**
  pull_request:
    branches:
      - anan/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Pillow
        shell: bash
        run: |
          python3 -m pip install --user Pillow==12.3.0 \
            || python3 -m pip install --user --break-system-packages Pillow==12.3.0

      - name: Run face script tests
        shell: bash
        run: python3 -m unittest discover -s scripts/anan_faces/tests -v

      - name: Check committed face animations are up to date
        shell: bash
        run: |
          B=main/boards/m5stack/stackchan
          python3 scripts/anan_faces/build_faces.py build "$B/assets-src/anan" "$B"
          git diff --exit-code -- "$B/emoji" "$B/assets/320_240/emote.json" "$B/anan_idle_actions.inc"
          untracked=$(git ls-files --others --exclude-standard -- "$B/emoji")
          if [[ -n "$untracked" ]]; then
            echo "Generated face files are not committed:"
            echo "$untracked"
            exit 1
          fi

      - name: Run host tests (skipped until the suite exists)
        shell: bash
        run: |
          TEST_DIR=main/boards/m5stack/stackchan/host_tests
          if [[ ! -f "$TEST_DIR/CMakeLists.txt" ]]; then
            echo "No $TEST_DIR/CMakeLists.txt yet, skipping host tests."
            exit 0
          fi
          cmake -S "$TEST_DIR" -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

  firmware:
    name: Build m5stack/stackchan firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          python scripts/build.py m5stack/stackchan --zip --language zh-CN --wake-word nihaoxiaozhi

      - name: Print wake-word sdkconfig lines
        shell: bash
        run: |
          echo "=== wake-word related sdkconfig lines ==="
          grep -E "WAKE_WORD|SR_WN|SR_MN|USE_DEVICE_AEC|LANGUAGE" sdkconfig || true

      - name: Print firmware file sizes and checksums
        shell: bash
        run: |
          echo "=== firmware file sizes and checksums (compare with the files you flash) ==="
          ls -l build/merged-binary.bin build/xiaozhi.bin build/configured_assets.bin
          sha256sum build/merged-binary.bin build/xiaozhi.bin build/configured_assets.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: anan-stackchan-firmware
          path: |
            build/merged-binary.bin
            build/xiaozhi.bin
            build/configured_assets.bin
            releases/*.zip
          if-no-files-found: error
